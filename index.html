<style>
#launchLoading{position:fixed;inset:0;z-index:2147483647;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-family:'Space Grotesk',sans-serif;transition:opacity 2s ease-in-out}
#launchGrid,#launchStatus{transition:opacity .6s ease}#launchLoading.clear-content #launchGrid,#launchLoading.clear-content #launchStatus{opacity:0}#launchLoading[hidden]{display:none}#launchLoading.leaving{opacity:0;pointer-events:none}
#launchGrid{display:grid;grid-template-columns:1fr;gap:6px;width:min(22vw,11dvh,92px)}
#launchGrid>div{aspect-ratio:1;min-width:0}#launchGrid img{display:block;width:100%;height:100%;object-fit:contain;animation:launchReveal .4s ease both}
@keyframes launchReveal{from{opacity:0}to{opacity:1}}#launchStatus{font-size:15px;letter-spacing:.08em;margin:0}
@media(prefers-reduced-motion:reduce){#launchGrid img{animation:none}#launchLoading{transition:none}}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/app-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>.entry-actions{display:flex;flex-direction:column;align-items:center;gap:12px}
.get-app{display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 12px;border:0;background:transparent;color:#aaa9b5;font:inherit;font-size:14px;cursor:pointer;letter-spacing:.04em}
.get-app svg{width:18px;height:18px}.get-app:hover,.get-app:focus-visible{color:#fff}.get-app[hidden],.language-gate.is-loading .get-app{display:none}
.install-guide{box-sizing:border-box;width:min(86vw,360px);max-height:85dvh;overflow:auto;margin:auto;padding:27px 24px;border:1px solid #676373;background:#101019;color:#f5efe0;text-align:center;font-family:'Space Grotesk','Noto Story Sans',sans-serif;border-radius:6px}
.install-guide::backdrop{background:#000b}.install-guide img{display:block;margin:0 auto 18px;border-radius:12px}.install-guide h2{font-size:20px;font-weight:400;line-height:1.4;margin:0 0 18px}.install-guide ol{text-align:left;padding-left:21px;font-size:16px;line-height:1.6;color:#ded9e3;margin:0 0 20px}.install-guide li+li{margin-top:10px}.install-close{border:1px solid #777;background:transparent;color:inherit;font:inherit;font-size:14px;min-height:44px;padding:10px 28px;cursor:pointer}
.install-share-icon{width:19px;height:19px;vertical-align:middle;color:#d2d3ff}
.language-gate .entry-actions{position:relative;flex:none;width:132px;height:50px}
.language-gate .get-app{position:absolute;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap}
.language-gate .entry-actions{position:relative;flex:none;width:132px;height:50px}.language-gate .get-app{position:absolute;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap}.install-guide{background:#000;border-color:#fff;border-radius:0}.install-guide img{border-radius:10px}#islandJournal[data-view=collection] h1{transform:translateY(5px)}</style></head>
<body>
<div id="launchLoading" hidden role="status" aria-live="polite"><div id="launchGrid" aria-hidden="true"></div><p id="launchStatus">Loading…</p></div>
<script>
(()=>{const overlay=document.getElementById('launchLoading'),grid=document.getElementById('launchGrid'),status=document.getElementById('launchStatus');
const cells=Array.from({length:5},()=>{const el=document.createElement('div');grid.append(el);return el});
const order=[4,3,2,1,0],cache=new Map(),delay=ms=>new Promise(r=>setTimeout(r,ms)),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function load(name){if(cache.has(name))return cache.get(name);const p=new Promise(resolve=>{const im=new Image();im.alt='';im.decoding='async';im.onload=()=>{if(im.decode)im.decode().catch(()=>{}).then(()=>resolve(im));else resolve(im)};im.onerror=()=>resolve(null);im.fetchPriority=name.startsWith('collection-shell-')?'high':'auto';im.src='assets/'+name});cache.set(name,p);return p}
const shells=Array.from({length:20},(_,i)=>'collection-shell-'+String(i+1).padStart(2,'0')+'.jpg');
const specimens=['scallop','cowrie','cockle','limpet','moon-snail'].map(n=>'specimen-'+n+'-painted.png');
const first=specimens.map(load); 
const allCollection=shells.slice(0,5).map(load); window.journalPriorityImages=allCollection;
const portrait=matchMedia('(orientation:portrait)').matches;
const essentials=[portrait?'home-portrait-empty.jpeg':'home-landscape-empty.jpeg',portrait?'island-mobile.jpg':'island-desktop.jpg','golden-1.jpg','crab-golden-idle.png','crab-golden-walk.png'];
const ready=Promise.all([...essentials.map(load),...allCollection]);
const dom=new Promise(resolve=>{if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',resolve,{once:true});else resolve()});
let finished=false;async function finish(){if(finished)return;finished=true;overlay.classList.add('clear-content');await delay(reduced?0:650);grid.style.visibility='hidden';status.style.visibility='hidden';await delay(reduced?0:200);overlay.classList.add('leaving');await delay(reduced?0:2050);overlay.hidden=true}
dom.then(()=>{const gate=document.getElementById('entryGate');gate.addEventListener('submit',()=>{overlay.hidden=false;const zh=gate.querySelector('input[name="language"]:checked')?.value==='zh';status.textContent=zh?'加载中…':'Loading…';
(async()=>{for(let i=0;i<5;i++){const im=await Promise.race([first[i],delay(1800).then(()=>null)]);if(im&&!finished)cells[order[i]].append(im);await delay(reduced?0:320)}await ready;await delay(reduced?0:450);finish()})();
setTimeout(()=>{status.textContent=zh?'仍在加载…':'Still loading…'},12000);setTimeout(finish,25000);
},{once:true});});
})();
</script><noscript><style>#launchLoading{display:none}</style></noscript>
<form id="entryGate" class="language-gate" aria-label="Entry preferences">
  <fieldset><legend id="gateLanguageLabel">Language</legend><div class="language-options"><label><input type="radio" name="language" value="zh"><span>中文</span></label><label><input type="radio" name="language" value="en" checked><span>English</span></label></div></fieldset>
  <div class="gate-settings"><fieldset><legend id="gateSoundLabel">Sound</legend><button type="button" id="gateSound" class="gate-option" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="gateSoundPath" d="M3 9h4l5-4v14l-5-4H3zM16 9l6 6m0-6-6 6"/></svg><span id="gateSoundText">Off</span></button></fieldset>
  <fieldset id="gateFullGroup" hidden><legend id="gateFullLabel">Full screen</legend><button type="button" id="gateFull" class="gate-option" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="gateFullPath" d="M8 3H3V8 M16 3H21V8 M3 16V21H8 M21 16V21H16"/></svg><span id="gateFullText">Off</span></button></fieldset></div>
  <button type="submit" id="gateEnter" class="gate-enter">Enter</button>
</form>
<script defer src="pwa.js?v=1"></script>
<main id="app">
  <section id="home" class="screen visible" aria-label="Game home screen">
    <div class="home-art clean-home" data-home-theme="coral"><picture><source media="(orientation: portrait)" srcset="assets/home-portrait-empty.jpeg"><img src="assets/home-landscape-empty.jpeg" alt="A watercolor hermit crab on a beach" draggable="false" fetchpriority="high"></picture><canvas id="homeCrabLayer" aria-hidden="true"></canvas><h1 id="homeTitle" class="home-title"><span>A Traveler</span> <span>in a Shell</span></h1><div class="home-buttons" aria-label="Main menu">
      <button id="begin" aria-label="Begin Journey">Begin Journey</button>
      <button id="collection" aria-label="Shell Collection">Shell Collection</button>
      <button id="islandMapHome" type="button">Island Map</button>
      <button id="continue" aria-label="Continue Journey">Continue Journey</button>
      <button id="settingsHome" aria-label="Settings">Settings</button>
      <button id="aboutHome" aria-label="About">About</button>
    </div>
    <small id="homeCredit" class="home-credit">Dalian, 2026</small>
    <button type="button" id="soundHome" class="home-sound" aria-pressed="false">Sound: Off</button></div><noscript><div class="js-warning">This file preview does not run JavaScript. Open the downloaded HTML in a web browser to play.</div></noscript>
  </section>

  <section id="game" class="screen" aria-label="Side scrolling platform game">
    <canvas id="stage" aria-label="Watercolor side-scrolling world"></canvas>
    <header class="game-hud" aria-label="Chapter and status">
      <div id="chapterTitle" class="hud-top-item"><span id="chapterName">Golden Shores</span><small id="chapterIndex">CHAPTER I</small></div>
      <div class="status-strip" id="statusStack" aria-label="Game status">
        <button id="pauseBtn" class="status-frame" aria-label="Pause and menu">MENU</button>
        <button type="button" id="soundGame" class="status-frame" aria-pressed="false">Sound: Off</button>
        <div id="statusLeft" class="status-frame" aria-label="3 of 3 lives"><span id="livesLabel">Lives:</span> <span id="hearts">3</span>/3</div>
        <div id="statusRight" class="status-frame"><span id="shellsLabel">Shells:</span> <span id="collectedCount">0</span>/5</div>
      </div>
    </header>
    <div id="controls" aria-label="Game controls">
      <div class="control-set movement"><button id="left" class="ctrl" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button><button id="right" class="ctrl" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div>
      <div id="shellSlots" class="control-set shells" hidden aria-label="Shell selection"></div>
      <div class="control-set actions"><button id="hide" class="ctrl action" aria-label="Hide"><span>HIDE</span></button><button id="jump" class="ctrl action" aria-label="Jump"><span>JUMP</span></button></div>
    </div>
    <div id="birdWarning" hidden><span></span><b><i></i></b></div>
    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <section id="overlay" class="screen overlay" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle"></h2>
      <div id="dialogBody"></div>
      <div id="dialogButtons"></div>
    </div>
  </section>
</main>
