<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#302846">
<title>A Traveler in a Shell · Playable Game</title>
<link rel="stylesheet" href="style.css?v=homegraphic05">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
</head>
<body>
<form id="entryGate" class="language-gate" aria-label="Entry preferences">
  <fieldset><legend id="gateLanguageLabel">Language</legend><div class="language-options"><label><input type="radio" name="language" value="zh"><span>中文</span></label><label><input type="radio" name="language" value="en" checked><span>English</span></label></div></fieldset>
  <div class="gate-settings"><fieldset><legend id="gateSoundLabel">Sound</legend><button type="button" id="gateSound" class="gate-option" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="gateSoundPath" d="M3 9h4l5-4v14l-5-4H3zM16 9l6 6m0-6-6 6"/></svg><span id="gateSoundText">Off</span></button></fieldset>
  <fieldset id="gateFullGroup" hidden><legend id="gateFullLabel">Full screen</legend><button type="button" id="gateFull" class="gate-option" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="gateFullPath" d="M8 3H3V8 M16 3H21V8 M3 16V21H8 M21 16V21H16"/></svg><span id="gateFullText">Off</span></button></fieldset></div>
  <button type="submit" id="gateEnter" class="gate-enter">Enter</button>
</form>
<main id="app">
  <section id="home" class="screen visible" aria-label="Game home screen">
    <div class="home-art clean-home" data-home-theme="teal"><picture><source media="(orientation: portrait)" srcset="assets/home-portrait-final.jpeg"><img src="assets/home-landscape-final.jpeg" alt="A watercolor hermit crab on a beach" draggable="false" fetchpriority="high"></picture><canvas id="homeCrabLayer" aria-hidden="true"></canvas><h1 id="homeTitle" class="home-title"><span>A Traveler</span> <span>in a Shell</span></h1><div class="home-buttons" aria-label="Main menu">
      <button id="begin" aria-label="Begin Journey">Begin Journey</button>
      <button id="collection" aria-label="Shell Collection">Shell Collection</button>
      <button id="continue" aria-label="Continue Journey">Continue Journey</button>
      <button id="settingsHome" aria-label="Settings">Settings</button>
    </div>
    <button id="soundHome" class="home-sound" aria-label="Toggle sound"><span aria-hidden="true" id="muteMark"></span></button></div><noscript><div class="js-warning">This file preview does not run JavaScript. Open the downloaded HTML in a web browser to play.</div></noscript>
  </section>

  <section id="game" class="screen" aria-label="Side scrolling platform game">
    <canvas id="stage" aria-label="Watercolor side-scrolling world"></canvas>
    <header class="game-hud" aria-label="Chapter and status">
      <div id="chapterTitle" class="hud-top-item"><span id="chapterName">Golden Shores</span><small id="chapterIndex">CHAPTER I</small></div>
      <div class="status-strip" id="statusStack" aria-label="Game status">
        <button id="pauseBtn" class="status-frame" aria-label="Pause and menu">MENU</button>
        <div id="statusLeft" class="status-frame" aria-label="3 of 3 lives"><span id="livesLabel">Lives:</span> <span id="hearts">3</span>/3</div>
        <div id="statusRight" class="status-frame"><span id="shellsLabel">Shells:</span> <span id="collectedCount">0</span>/5</div>
      </div>
    </header>
    <div id="controls" aria-label="Game controls">
      <div class="control-set movement"><button id="left" class="ctrl" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button><button id="right" class="ctrl" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div>
      <div id="shellSlots" class="control-set shells" hidden aria-label="Shell selection"></div>
      <div class="control-set actions"><button id="hide" class="ctrl action" aria-label="Hide"><span>HIDE</span></button><button id="jump" class="ctrl action" aria-label="Jump"><span>JUMP</span></button></div>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <section id="overlay" class="screen overlay" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle"></h2>
      <div id="dialogBody"></div>
      <div id="dialogButtons"></div>
    </div>
  </section>
</main>
<script src="terrain-data.js?v=2"></script>
<script src="crab-idle.js?v=1"></script>
<script src="game.js?v=homegraphic05"></script>
</body>
</html>
