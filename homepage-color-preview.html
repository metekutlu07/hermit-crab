<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homepage color studio</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f2;color:#292929;font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px}header{width:min(100%,620px)}h2{font-size:16px;margin:0 0 10px;font-weight:600}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatches button{font:inherit;background:white;color:#222;border:1px solid #ccc;border-radius:7px;padding:7px 9px;display:flex;align-items:center;gap:6px;cursor:pointer}.swatches button[aria-pressed=true]{border-color:#333;outline:1px solid #333}.dot{height:16px;width:16px;border:1px solid #0002;border-radius:50%;flex:none}label{display:flex;align-items:center;gap:9px;margin-top:10px}input[type=color]{width:38px;height:28px;border:0;padding:0;background:transparent}output{font-variant-numeric:tabular-nums} .scene{width:min(100%,360px);aspect-ratio:710/1295;position:relative;overflow:hidden;container-type:inline-size;background:url('assets/home-portrait-empty.jpeg') center/cover no-repeat;--ink:#245e5d;font-family:'Space Grotesk',Arial,sans-serif}.title{position:absolute;top:13.5%;left:0;width:100%;text-align:center;color:var(--ink);font-size:5.25cqw;font-weight:500;letter-spacing:-.052em;white-space:nowrap;margin:0;line-height:1.15}.crab{position:absolute;width:45%;aspect-ratio:400/380;left:49%;top:23.4%;transform:translateX(-50%);background-image:url('assets/crab-home-look.png');background-size:400% 200%;background-position:0 0;background-repeat:no-repeat}.menu{position:absolute;top:50%;left:27.5%;width:45%;height:26%;display:grid;grid-template-rows:repeat(4,1fr);gap:1.3cqw}.menu div{display:grid;place-items:center;border:1px solid var(--ink);color:var(--ink);font-size:3.45cqw;font-weight:500;white-space:nowrap;background:transparent;text-shadow:none;box-shadow:none}.title{text-shadow:none}.scene,.scene *{filter:none}p{margin:4px 0;font-size:12px;color:#666} .color-tools{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.shade{height:112px;position:relative;border:1px solid #0002;border-radius:6px;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent),hsl(var(--hue,180) 100% 50%);touch-action:none;cursor:crosshair}.hue{height:22px;position:relative;border-radius:5px;background:linear-gradient(to right,red,#ff0,#0f0,#0ff,#00f,#f0f,red);touch-action:none;cursor:crosshair}.cursor{position:absolute;pointer-events:none;width:14px;height:14px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #333;transform:translate(-50%,-50%)}.hue .cursor{width:10px;height:28px;border-radius:3px;top:50%}.hexrow{display:flex;align-items:center;gap:8px}.hexrow input{width:90px;font:14px monospace;border:1px solid #bbb;border-radius:5px;padding:6px;background:#fff;color:#222}.hexrow button{font:inherit;padding:6px 10px;background:white;border:1px solid #bbb;border-radius:5px}.sample{width:27px;height:27px;border:1px solid #0002;border-radius:5px}.shade:focus-visible,.hue:focus-visible{outline:2px solid #444;outline-offset:3px}@media(min-width:740px){body{display:grid;grid-template-columns:minmax(260px,400px) minmax(240px,360px);justify-content:center;align-items:center;gap:32px;min-height:100dvh}.shade{height:180px}.scene{width:100%}}@media(max-width:739px){body{padding:8px;gap:7px}.swatches button{font-size:11px;padding:4px 6px}.shade{height:90px}.color-tools{gap:6px;margin-top:7px}.scene{width:min(100%,calc((100dvh - 250px)*710/1295),360px);min-width:min(100%,190px)}header h2{margin-bottom:6px}p{font-size:11px}}</style></head><body><header><h2>Homepage color studio</h2><div class="swatches" id="swatches"></div><div class="color-tools"><div class="shade" id="shade" role="slider" tabindex="0" aria-label="Color saturation and brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><span class="cursor" id="shadeCursor"></span></div><div class="hue" id="hue" role="slider" tabindex="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="359" aria-valuenow="180"><span class="cursor" id="hueCursor"></span></div><div class="hexrow"><span id="sample" class="sample"></span><label style="margin:0" for="hex">HEX</label><input id="hex" value="#245E5D" maxlength="7" spellcheck="false" aria-label="Hex color"><button id="copy" type="button">Copy</button></div></div><p>Same artwork and animation in every color. Preview only.</p></header><main class="scene" id="scene"><h1 class="title">A Traveler in a Shell</h1><div class="crab" id="crab" aria-hidden="true"></div><div class="menu"><div>Begin Journey</div><div>Shell Collection</div><div>Continue Journey</div><div>Settings</div></div></main><script>
const palette=[['Lavender','#9363a8'],['Pink','#d75578'],['Turquoise','#00818b'],['Light blue-green','#409eaa'],['White','#ffffff'],['Original teal','#245e5d']];
const scene=document.querySelector('#scene'),hex=document.querySelector('#hex'),list=document.querySelector('#swatches'),shade=document.querySelector('#shade'),hue=document.querySelector('#hue'),sc=document.querySelector('#shadeCursor'),hc=document.querySelector('#hueCursor'),sample=document.querySelector('#sample');
let H=180,S=.6,V=.37;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function toHex(h,s,v){const f=n=>{const k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1)))).toString(16).padStart(2,'0')};return '#'+f(5)+f(3)+f(1)}
function fromHex(c){const [r,g,b]=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255),max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;V=max;S=max?d/max:0;if(d){H=60*(max===r?((g-b)/d+6)%6:max===g?(b-r)/d+2:(r-g)/d+4)}}
function paint(){const c=toHex(H,S,V);scene.style.setProperty('--ink',c);hex.value=c.toUpperCase();sample.style.background=c;shade.style.setProperty('--hue',H);sc.style.left=S*100+'%';sc.style.top=(1-V)*100+'%';hc.style.left=H/360*100+'%';hue.setAttribute('aria-valuenow',Math.round(H));shade.setAttribute('aria-valuenow',Math.round(S*100));shade.setAttribute('aria-valuetext','Saturation '+Math.round(S*100)+'%, brightness '+Math.round(V*100)+'%');list.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===c)))}
function choose(c){fromHex(c);paint()}
function drag(el,fn){let active=null;const at=e=>{const r=el.getBoundingClientRect();fn(clamp((e.clientX-r.left)/r.width,0,1),clamp((e.clientY-r.top)/r.height,0,1));paint()};el.addEventListener('pointerdown',e=>{active=e.pointerId;el.setPointerCapture(active);at(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===active)at(e)});for(const n of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(n,e=>{if(e.pointerId===active)active=null})}
drag(shade,(x,y)=>{S=x;V=1-y});drag(hue,x=>{H=Math.min(359.999,x*360)});
shade.addEventListener('keydown',e=>{const d=e.shiftKey?.1:.02;if(e.key==='ArrowLeft')S=clamp(S-d,0,1);else if(e.key==='ArrowRight')S=clamp(S+d,0,1);else if(e.key==='ArrowUp')V=clamp(V+d,0,1);else if(e.key==='ArrowDown')V=clamp(V-d,0,1);else return;e.preventDefault();paint()});hue.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();H=(H+(['ArrowLeft','ArrowDown'].includes(e.key)?-1:1)*(e.shiftKey?15:3)+360)%360;paint()});
palette.forEach(([name,c])=>{const b=document.createElement('button');b.type='button';b.dataset.color=c;const dot=document.createElement('span');dot.className='dot';dot.style.background=c;b.append(dot,name);b.onclick=()=>choose(c);list.append(b)});hex.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(hex.value))choose(hex.value)};hex.onblur=paint;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(hex.value);document.querySelector('#copy').textContent='Copied';setTimeout(()=>document.querySelector('#copy').textContent='Copy',1000)}catch{hex.select()}};choose('#245e5d');
const seq=[[0,1800],[1,250],[2,750],[1,250],[3,1400],[4,180],[3,800],[5,300],[6,800],[7,400],[0,1300]],crab=document.querySelector('#crab');let i=0;function next(){const [n,ms]=seq[i];crab.style.backgroundPosition=((n%4)*100/3)+'% '+(n>=4?100:0)+'%';i=(i+1)%seq.length;setTimeout(next,ms)}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)next();
</script></body></html>
