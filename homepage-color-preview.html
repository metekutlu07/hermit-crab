<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homepage color studio</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f2;color:#292929;font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px}header{width:min(100%,620px)}h2{font-size:16px;margin:0 0 10px;font-weight:600}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatches button{font:inherit;background:white;color:#222;border:1px solid #ccc;border-radius:7px;padding:7px 9px;display:flex;align-items:center;gap:6px;cursor:pointer}.swatches button[aria-pressed=true]{border-color:#333;outline:1px solid #333}.dot{height:16px;width:16px;border:1px solid #0002;border-radius:50%;flex:none}label{display:flex;align-items:center;gap:9px;margin-top:10px}input[type=color]{width:38px;height:28px;border:0;padding:0;background:transparent}output{font-variant-numeric:tabular-nums} .scene{width:min(100%,360px);aspect-ratio:710/1295;position:relative;overflow:hidden;container-type:inline-size;background:url('assets/home-portrait-empty.jpeg') center/cover no-repeat;--ink:#245e5d;font-family:'Space Grotesk',Arial,sans-serif}.title{position:absolute;top:13.5%;left:0;width:100%;text-align:center;color:var(--ink);font-size:5.25cqw;font-weight:500;letter-spacing:-.052em;white-space:nowrap;margin:0;line-height:1.15}.crab{position:absolute;width:45%;aspect-ratio:400/380;left:49%;top:23.4%;transform:translateX(-50%);background-image:url('assets/crab-home-look.png');background-size:400% 200%;background-position:0 0;background-repeat:no-repeat}.menu{position:absolute;top:50%;left:27.5%;width:45%;height:26%;display:grid;grid-template-rows:repeat(4,1fr);gap:1.3cqw}.menu div{display:grid;place-items:center;border:1px solid var(--ink);color:var(--ink);font-size:3.45cqw;font-weight:500;white-space:nowrap;background:transparent;text-shadow:none;box-shadow:none}.title{text-shadow:none}.scene,.scene *{filter:none}p{margin:4px 0;font-size:12px;color:#666} </style></head><body><header><h2>Homepage color studio</h2><div class="swatches" id="swatches"></div><label>Custom color <input id="pick" type="color" value="#245e5d"><output id="hex">#245E5D</output></label><p>Same artwork and animation in every color. Preview only.</p></header><main class="scene" id="scene"><h1 class="title">A Traveler in a Shell</h1><div class="crab" id="crab" aria-hidden="true"></div><div class="menu"><div>Begin Journey</div><div>Shell Collection</div><div>Continue Journey</div><div>Settings</div></div></main><script>
const palette=[['Lavender','#9363a8'],['Pink','#d75578'],['Turquoise','#00818b'],['Light blue-green','#409eaa'],['White','#ffffff'],['Original teal','#245e5d']];
const scene=document.querySelector('#scene'),picker=document.querySelector('#pick'),hex=document.querySelector('#hex'),list=document.querySelector('#swatches');
function choose(c){scene.style.setProperty('--ink',c);picker.value=c;hex.textContent=c.toUpperCase();list.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===c)))}
palette.forEach(([name,c])=>{const b=document.createElement('button');b.type='button';b.dataset.color=c;const dot=document.createElement('span');dot.className='dot';dot.style.background=c;b.append(dot,name);b.onclick=()=>choose(c);list.append(b)});picker.oninput=()=>choose(picker.value);choose('#245e5d');
const seq=[[0,1800],[1,250],[2,750],[1,250],[3,1400],[4,180],[3,800],[5,300],[6,800],[7,400],[0,1300]],crab=document.querySelector('#crab');let i=0;function next(){const [n,ms]=seq[i];crab.style.backgroundPosition=((n%4)*100/3)+'% '+(n>=4?100:0)+'%';i=(i+1)%seq.length;setTimeout(next,ms)}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)next();
</script></body></html>
